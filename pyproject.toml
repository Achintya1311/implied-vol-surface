[project]
name = "volsurface"
version = "0.1.0"
description = "Implied volatility surface fitting, Greeks and no-arbitrage checks for NSE option chains."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "plotly",
    "requests",
    "yfinance",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["volsurface*"]
